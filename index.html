<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Quest: Road to the Technical Screen</title>
<style>
:root{--bg:#fbfaf7;--card:#fff;--ink:#1f2328;--mute:#5f6670;--line:#e3e0d8;--acc:#d9622b;--acc2:#2f7d6d;--soft:#fff4ec;--good:#e8f5ef;--code:#f4f2ee;--focus:#2b6cd9}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--card:#1e2125;--ink:#e8e6e3;--mute:#a3a9b0;--line:#33373d;--acc:#f08a4b;--acc2:#5cc2a8;--soft:#2b221c;--good:#18302a;--code:#25292e;--focus:#7aa7ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 60px}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:12px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0}
h2{font-size:18px;margin:4px 0 10px}
.hud{display:flex;gap:10px;flex-wrap:wrap;font-size:14px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.bar>i{display:block;height:100%;background:var(--acc2);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0;max-width:100%;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
button,select{font:inherit;color:inherit}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.small{padding:6px 10px;font-size:14px}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mode b{display:block}.mode span{color:var(--mute);font-size:14px}
.opt{display:flex;gap:10px;width:100%;min-width:0;margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;text-align:left}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--code);display:grid;place-items:center;font-size:13px;font-weight:600}
.opt pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}
.opt.dim{opacity:.45}
.opt.right{border-color:var(--acc2);background:var(--good)}
.opt[disabled]{cursor:default}
.dunno{display:block;width:100%;margin-top:6px;text-align:center;border-style:dashed;color:var(--mute)}
.dunno:hover{color:var(--ink)}
.dunno:disabled{opacity:.55;cursor:default}
.dunno kbd{margin-left:4px}
.review-actions{align-items:stretch}
.review-actions .btn{flex:1 1 160px}
.review-list{margin:12px 0 0;padding-left:1.2em}
.review-list li{margin:8px 0;overflow-wrap:anywhere}
.review-md{width:100%;min-height:160px;max-height:280px;margin-top:8px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;background:var(--code);color:var(--ink);padding:8px;white-space:pre;overflow:auto}
pre,code{font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
pre.code{background:var(--code);border-radius:8px;padding:10px;overflow:auto;white-space:pre;max-width:100%}
.meta{color:var(--mute);font-size:13px}
.fb{border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--soft)}
.fb.good{background:var(--good)}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.badge{border:1px dashed var(--line);border-radius:10px;padding:8px;font-size:14px;color:var(--mute)}
.badge.on{border-style:solid;border-color:var(--acc2);color:var(--ink)}
table.stats{width:100%;border-collapse:collapse;font-size:14px}
table.stats td,table.stats th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.timer{font:600 28px ui-monospace,monospace}
label.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
details summary{cursor:pointer;color:var(--mute);font-size:14px}
.hidden{display:none}
.savebar{margin:8px 0 4px;gap:8px}
.status{font-size:13px;padding:3px 8px;border-radius:8px}
.status.ok{color:var(--mute)}
.status.warn{background:#fde8e1;color:#8a2a0a;border:1px solid #e9a58c;font-weight:600}
@media (prefers-color-scheme:dark){.status.warn{background:#3a1f16;color:#ffb89a;border-color:#7a3a22}}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner" role="note">⌨️ Practice with AI autocomplete off. Looking up syntax is fine, same as the real round.</div>
  <header>
    <div>
      <h1>🐾 Cat Quest: Road to the Technical Screen</h1>
      <div class="meta">RevenueCat · Senior Software Engineer, Agents · SQL + TypeScript</div>
      <div class="meta" id="countdown"></div>
    </div>
    <div class="hud" aria-live="polite">
      <span class="pill" id="hudLevel"></span>
      <span class="pill" id="hudXp"></span>
      <span class="pill" id="hudFlame" title="Daily streak"></span>
      <span class="pill" id="hudFreeze" title="Streak freezes"></span>
    </div>
  </header>
  <div class="bar" aria-hidden="true"><i id="xpBar"></i></div>
  <div class="meta" id="xpNext"></div>
  <div class="row savebar">
    <span id="saveStatus" class="status ok" role="status" aria-live="polite"></span>
    <button class="btn small" id="exportBtn" title="Download cat-quest-progress.json. Keep it as a backup, or load it into another browser.">💾 Export progress</button>
    <button class="btn small" id="importBtn" title="Load a cat-quest-progress.json file you exported earlier.">📂 Import progress</button>
    <input type="file" id="importFile" accept=".json,application/json" class="hidden" aria-label="Cat Quest progress file">
  </div>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const DATA = {"questions":[{"id":"sql-01","tag":"sql","day":1,"q":"How many rows does this inner join return?","code":"SELECT u.name, s.product_id\nFROM users u\nJOIN subscriptions s ON s.user_id = u.id;","lang":"sql","setup":null,"tables":["users","subscriptions"],"options":["4","6","7","5"],"answer":1,"explain":"An inner join keeps only matching pairs. There are 6 subscriptions and each one has a user, so 6 rows. dee has no subscriptions and drops out.","source":null},{"id":"sql-02","tag":"sql","day":1,"q":"Which query lists users who have no subscriptions at all?","code":null,"lang":"sql","setup":null,"tables":["users","subscriptions"],"options":["SELECT u.name FROM users u\nLEFT JOIN subscriptions s ON s.user_id = u.id\nWHERE s.id = NULL;","SELECT u.name FROM users u\nLEFT JOIN subscriptions s\n  ON s.user_id = u.id AND s.id IS NULL;","SELECT u.name FROM users u\nJOIN subscriptions s ON s.user_id = u.id\nWHERE s.id IS NULL;","SELECT u.name FROM users u\nLEFT JOIN subscriptions s ON s.user_id = u.id\nWHERE s.id IS NULL;"],"answer":3,"explain":"LEFT JOIN keeps every user and fills the subscription side with NULL when nothing matches. Filter with IS NULL in WHERE. \"= NULL\" is never true, an inner join never produces the NULL row, and putting the test in ON just keeps every user.","source":null},{"id":"sql-03","tag":"sql","day":1,"q":"The goal is active subscriptions per user, including users with zero. What does this query actually return?","code":"SELECT u.name, COUNT(s.id) AS n\nFROM users u\nLEFT JOIN subscriptions s ON s.user_id = u.id\nWHERE s.status = 'active'\nGROUP BY u.name\nORDER BY u.name;","lang":"sql","setup":null,"tables":["users","subscriptions"],"options":["ana, 2 / ben, 1 / cy, 2","ana, 2 / ben, 1 / cy, 2 / dee, 0","ana, 2 / ben, 2 / cy, 2","ana, 2 / ben, 2 / cy, 2 / dee, 0"],"answer":0,"explain":"The WHERE filter runs after the join, and dee's NULL row fails s.status = 'active', so the LEFT JOIN quietly becomes an inner join. Move the status check into the ON clause to keep dee with 0.","source":null},{"id":"sql-04","tag":"sql","day":1,"q":"dee has no subscriptions. What does this return?","code":"SELECT COUNT(*)\nFROM users u\nLEFT JOIN subscriptions s ON s.user_id = u.id\nWHERE u.name = 'dee';","lang":"sql","setup":null,"tables":["users","subscriptions"],"options":["An error","NULL","0","1"],"answer":3,"explain":"COUNT(*) counts rows, and the LEFT JOIN produces one row for dee with NULLs on the right. COUNT(s.id) would give 0 because COUNT(column) skips NULLs.","source":null},{"id":"sql-05","tag":"sql","day":1,"q":"Which user_ids come back?","code":"SELECT user_id\nFROM subscriptions\nGROUP BY user_id\nHAVING SUM(price) > 20\nORDER BY user_id;","lang":"sql","setup":null,"tables":["subscriptions"],"options":["1 / 2 / 3","1 / 3","1","3"],"answer":1,"explain":"Totals are user 1: 69.98, user 2: 19.98, user 3: 159.98. HAVING filters groups after aggregation, so users 1 and 3 pass.","source":null},{"id":"sql-06","tag":"sql","day":2,"q":"Revenue per product from active subscriptions only, keeping products whose total is over 25. Which query does that?","code":null,"lang":"sql","setup":null,"tables":["subscriptions"],"options":["SELECT product_id, SUM(price) FROM subscriptions\nGROUP BY product_id\nHAVING SUM(price) > 25\nORDER BY product_id;","SELECT product_id, SUM(price) FROM subscriptions\nWHERE status = 'active'\nGROUP BY product_id\nHAVING SUM(price) > 25\nORDER BY product_id;","SELECT product_id, SUM(price) FROM subscriptions\nWHERE status = 'active' AND SUM(price) > 25\nGROUP BY product_id\nORDER BY product_id;","SELECT product_id, SUM(price) FROM subscriptions\nWHERE status = 'active' AND price > 25\nGROUP BY product_id\nORDER BY product_id;"],"answer":1,"explain":"Row filters go in WHERE, group filters go in HAVING. An aggregate in WHERE is an error, dropping the status filter counts the expired row (39.96 for pro_monthly), and price > 25 per row drops pro_monthly entirely.","source":null},{"id":"sql-07","tag":"sql","day":1,"q":"What does this return?","code":"SELECT COALESCE(NULL, NULL, 'trial', 'paid');","lang":"sql","setup":null,"tables":null,"options":["paid","NULL","trial","trial, paid"],"answer":2,"explain":"COALESCE returns its first non-NULL argument. Handy for defaults like COALESCE(country, 'unknown').","source":null},{"id":"sql-08","tag":"sql","day":1,"q":"dee's country is NULL. What does this count?","code":"SELECT COUNT(*) FROM users WHERE country \u003c> 'US';","lang":"sql","setup":null,"tables":["users"],"options":["3","1","0","2"],"answer":1,"explain":"NULL \u003c> 'US' is unknown, not true, so dee is skipped. Only ben (DE) counts. To include unknowns: WHERE country IS DISTINCT FROM 'US' (Postgres) or add OR country IS NULL.","source":null},{"id":"sql-09","tag":"sql","day":1,"q":"Table t holds 10, NULL and 20. What does AVG return?","code":"SELECT AVG(x) FROM t;","lang":"sql","setup":"CREATE TABLE t (x int); INSERT INTO t VALUES (10), (NULL), (20);","tables":null,"options":["NULL","30","10","15"],"answer":3,"explain":"Aggregates skip NULLs, so it averages 10 and 20. If NULL should count as 0, write AVG(COALESCE(x, 0)), which gives 10.","source":null},{"id":"sql-10","tag":"sql","day":1,"q":"What does this return?","code":"SELECT COUNT(DISTINCT product_id) FROM subscriptions;","lang":"sql","setup":null,"tables":["subscriptions"],"options":["2","6","3","4"],"answer":2,"explain":"Three distinct products: pro_monthly, pro_annual, lifetime. COUNT(DISTINCT col) also ignores NULLs.","source":null},{"id":"sql-11","tag":"sql","day":2,"q":"In Postgres, which query returns each user's latest event type?","code":null,"lang":"sql","setup":null,"tables":["events"],"options":["SELECT user_id, type, MAX(event_ts)\nFROM events GROUP BY user_id ORDER BY user_id;","WITH ranked AS (\n  SELECT user_id, type,\n    ROW_NUMBER() OVER (ORDER BY event_ts DESC) AS rn\n  FROM events)\nSELECT user_id, type FROM ranked WHERE rn = 1 ORDER BY user_id;","WITH ranked AS (\n  SELECT user_id, type,\n    ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY event_ts ASC) AS rn\n  FROM events)\nSELECT user_id, type FROM ranked WHERE rn = 1 ORDER BY user_id;","WITH ranked AS (\n  SELECT user_id, type,\n    ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY event_ts DESC) AS rn\n  FROM events)\nSELECT user_id, type FROM ranked WHERE rn = 1 ORDER BY user_id;"],"answer":3,"explain":"PARTITION BY user_id restarts the numbering per user and ORDER BY event_ts DESC puts the newest first. Postgres rejects the GROUP BY version because type isn't grouped (SQLite accepts it through an engine-specific rule, so don't rely on it). ASC gives the earliest, and no partition gives one row overall.","source":null},{"id":"sql-12","tag":"sql","day":2,"q":"Postgres has a shortcut for \"latest row per user\". What does this return?","code":"SELECT DISTINCT ON (user_id) user_id, type\nFROM events\nORDER BY user_id, event_ts DESC;","lang":"sql","setup":null,"tables":["events"],"options":["2, INITIAL_PURCHASE","1, INITIAL_PURCHASE / 2, INITIAL_PURCHASE / 3, INITIAL_PURCHASE","1, CANCELLATION / 2, INITIAL_PURCHASE / 3, RENEWAL","1, CANCELLATION / 2, EXPIRATION / 3, RENEWAL"],"answer":2,"explain":"DISTINCT ON keeps the first row per user_id in the ORDER BY order, so newest first gives the latest event. ben's latest is the re-purchase on Mar 1, after his Feb expiration. Postgres only; ROW_NUMBER works everywhere.","source":null},{"id":"sql-13","tag":"sql","day":2,"q":"b and c tie at 80. What does RANK give?","code":"SELECT name, RANK() OVER (ORDER BY score DESC) AS r\nFROM scores ORDER BY name;","lang":"sql","setup":"CREATE TABLE scores (name text, score int); INSERT INTO scores VALUES ('a',90),('b',80),('c',80),('d',70);","tables":null,"options":["a, 1 / b, 2 / c, 2 / d, 3","a, 1 / b, 2 / c, 3 / d, 4","a, 1 / b, 1 / c, 1 / d, 2","a, 1 / b, 2 / c, 2 / d, 4"],"answer":3,"explain":"RANK gives ties the same number and then skips (1, 2, 2, 4). DENSE_RANK doesn't skip (1, 2, 2, 3). ROW_NUMBER never ties (1, 2, 3, 4).","source":null},{"id":"sql-14","tag":"sql","day":2,"q":"Month-over-month change with LAG. What comes back?","code":"SELECT m, rev - LAG(rev) OVER (ORDER BY m) AS change\nFROM monthly ORDER BY m;","lang":"sql","setup":"CREATE TABLE monthly (m int, rev int); INSERT INTO monthly VALUES (1,100),(2,120),(3,90);","tables":null,"options":["2, 20 / 3, -30","1, NULL / 2, 20 / 3, -30","1, 0 / 2, 20 / 3, -30","1, 100 / 2, 20 / 3, -30"],"answer":1,"explain":"LAG reads the previous row. The first row has no previous, so LAG is NULL and the subtraction is NULL. Use LAG(rev, 1, 0) or COALESCE if you want 0 there.","source":null},{"id":"sql-15","tag":"sql","day":2,"q":"What does this CTE query return?","code":"WITH per_user AS (\n  SELECT user_id, SUM(price) AS total\n  FROM subscriptions\n  GROUP BY user_id\n)\nSELECT COUNT(*) FROM per_user WHERE total > 50;","lang":"sql","setup":null,"tables":["subscriptions"],"options":["6","3","2","1"],"answer":2,"explain":"The CTE makes one row per user (69.98, 19.98, 159.98). Two totals are above 50. CTEs are a readable way to name a step, which interviewers like.","source":null},{"id":"sql-16","tag":"sql","day":2,"q":"Top 2 products by revenue per month. What does this return?","code":"WITH ranked AS (\n  SELECT month, product,\n    ROW_NUMBER() OVER (PARTITION BY month ORDER BY revenue DESC) AS rn\n  FROM sales\n)\nSELECT month, product FROM ranked\nWHERE rn \u003c= 2\nORDER BY month, rn;","lang":"sql","setup":"CREATE TABLE sales (month text, product text, revenue int);\nINSERT INTO sales VALUES ('2026-01','monthly',100),('2026-01','annual',300),('2026-01','lifetime',50),\n('2026-02','monthly',120),('2026-02','annual',80),('2026-02','lifetime',200);","tables":null,"options":["2026-02, lifetime / 2026-01, annual","2026-01, annual / 2026-01, monthly / 2026-02, monthly / 2026-02, annual","2026-01, annual / 2026-02, lifetime","2026-01, annual / 2026-01, monthly / 2026-02, lifetime / 2026-02, monthly"],"answer":3,"explain":"Top N per group is a window function partitioned by the group, then a filter on the rank. If ties matter, ask whether to use RANK so tied products both show.","source":null},{"id":"sql-17","tag":"sql","day":2,"q":"Revenue bucketed by start month (Postgres). What comes back?","code":"SELECT to_char(date_trunc('month', started_at), 'YYYY-MM') AS month,\n       SUM(price) AS revenue\nFROM subscriptions\nGROUP BY 1\nORDER BY 1;","lang":"sql","setup":null,"tables":["subscriptions"],"options":["2026-01, 9.99 / 2026-02, 149.99 / 2026-03, 59.99","2026-01, 19.98 / 2026-02, 159.98","2026-01, 2 / 2026-02, 2 / 2026-03, 2","2026-01, 19.98 / 2026-02, 159.98 / 2026-03, 69.98"],"answer":3,"explain":"date_trunc('month', ...) snaps each date to the first of its month, so rows group by month. GROUP BY 1 means \"the first select column\". In SQLite you would use strftime('%Y-%m', started_at).","source":null},{"id":"sql-18","tag":"sql","day":6,"q":"\"Events in February\". How many rows does this count?","code":"SELECT COUNT(*) FROM e\nWHERE ts BETWEEN '2026-02-01' AND '2026-02-28';","lang":"sql","setup":"CREATE TABLE e (ts timestamp);\nINSERT INTO e VALUES ('2026-02-01 00:00'),('2026-02-14 12:00'),('2026-02-28 18:30'),('2026-03-01 00:00');","tables":null,"options":["1","3","2","4"],"answer":2,"explain":"'2026-02-28' means midnight at the start of Feb 28, so the 18:30 event is missed. Use a half-open range: ts >= '2026-02-01' AND ts \u003c '2026-03-01', which gives 3.","source":null},{"id":"sql-19","tag":"sql","day":6,"q":"Postgres FILTER clause. What does this return?","code":"SELECT COUNT(*) FILTER (WHERE status = 'active')  AS active,\n       COUNT(*) FILTER (WHERE status = 'expired') AS expired\nFROM subscriptions;","lang":"sql","setup":null,"tables":["subscriptions"],"options":["5, 0","5, 1","1, 5","6, 1"],"answer":1,"explain":"FILTER applies a WHERE to one aggregate, so you get several counts in one pass. The portable version is SUM(CASE WHEN status = 'active' THEN 1 ELSE 0 END).","source":null},{"id":"sql-20","tag":"sql","day":6,"q":"processed already holds e1. Then this runs: INSERT INTO processed VALUES ('e1'), ('e2') ON CONFLICT (event_id) DO NOTHING. What does the count show?","code":"SELECT COUNT(*) FROM processed;","lang":"sql","setup":"CREATE TABLE processed (event_id text PRIMARY KEY);\nINSERT INTO processed VALUES ('e1');\nINSERT INTO processed VALUES ('e1'), ('e2') ON CONFLICT (event_id) DO NOTHING;","tables":null,"options":["1","3","2","The insert errors, so 1"],"answer":2,"explain":"ON CONFLICT DO NOTHING skips the duplicate e1 and inserts e2. This is the standard Postgres way to make webhook processing idempotent: a unique key on the event id.","source":null},{"id":"sql-21","tag":"sql","day":2,"q":"blocked holds user_id 2 and a NULL. How many users does this count?","code":"SELECT COUNT(*) FROM users\nWHERE id NOT IN (SELECT user_id FROM blocked);","lang":"sql","setup":"CREATE TABLE blocked (user_id int); INSERT INTO blocked VALUES (2), (NULL);","tables":["users"],"options":["2","0","4","3"],"answer":1,"explain":"With a NULL in the list, \"id NOT IN (2, NULL)\" is never true, so nothing comes back. Use NOT EXISTS, or filter NULLs out of the subquery, and you get 3.","source":null},{"id":"sql-22","tag":"sql","day":2,"q":"A quick conversion-rate calculation in Postgres. What does this return?","code":"SELECT 7 / 2;","lang":"sql","setup":null,"tables":null,"options":["An error","3.5","4","3"],"answer":3,"explain":"Integer divided by integer stays an integer in Postgres, and it truncates. Cast one side for a rate: 7::numeric / 2 or 7 * 1.0 / 2.","source":null},{"id":"ds-01","tag":"ds","day":3,"q":"You check 50,000 incoming user IDs against 200,000 known IDs. Which is the better shape for the known IDs, and why?","code":null,"lang":null,"setup":null,"tables":null,"options":["A sorted array plus indexOf, because sorting makes indexOf O(log n)","A Set, because has() is O(1) on average, so the whole check is about O(n + m)","An array, because includes() is fast enough at this size","An object with numeric keys, because objects are faster than Sets"],"answer":1,"explain":"Array includes() scans, so 50k checks against 200k is about 10 billion comparisons in the worst case. Building a Set once makes each check constant time on average. Same move as swapping a list lookup for a dictionary.","source":null},{"id":"ds-02","tag":"ds","day":3,"q":"Frequency count with a Map. What is counts.get(\"RENEWAL\")?","code":"const types = [\"RENEWAL\", \"INITIAL_PURCHASE\", \"RENEWAL\", \"EXPIRATION\", \"RENEWAL\"];\nconst counts = new Map\u003cstring, number>();\nfor (const t of types) {\n  counts.set(t, (counts.get(t) ?? 0) + 1);\n}","lang":"ts","setup":null,"tables":null,"options":["undefined","NaN","2","3"],"answer":3,"explain":"counts.get(t) ?? 0 starts each key at 0, then adds 1. RENEWAL appears 3 times. Without the ?? 0 you would get undefined + 1, which is NaN.","source":null},{"id":"ds-03","tag":"ds","day":3,"q":"Checking that brackets in a template string are balanced, like \"{{ price }}\". Which structure fits?","code":null,"lang":null,"setup":null,"tables":null,"options":["A queue: enqueue opens, dequeue on close","A stack: push on open, pop and compare on close","A sorted array of positions","A Set of the characters seen"],"answer":1,"explain":"The most recent unclosed bracket must close first, which is last-in first-out. At the end the stack must be empty.","source":null},{"id":"ds-04","tag":"ds","day":3,"q":"You use a plain JS array as a queue for 100,000 jobs. Which operation costs O(n) per call?","code":null,"lang":null,"setup":null,"tables":null,"options":["arr[i]","pop()","shift()","push()"],"answer":2,"explain":"shift() removes the first element and re-indexes everything after it. For a big queue, keep a head index or use a small linked list. In Python, collections.deque has O(1) popleft().","source":null},{"id":"ds-05","tag":"ds","day":3,"q":"What does this produce?","code":"const prices = [10, 9, 1, 100];\nconst sorted = [...prices].sort();","lang":"ts","setup":null,"tables":null,"options":["[100, 10, 9, 1]","[1, 10, 100, 9]","[1, 9, 10, 100]","[10, 9, 1, 100]"],"answer":1,"explain":"With no comparator, sort() compares values as strings, so \"10\" comes before \"9\". For numbers pass (a, b) => a - b.","source":null},{"id":"ds-06","tag":"ds","day":3,"q":"Sort events by timestamp, then by id to break ties. What is the id order?","code":"const events = [\n  { id: 3, ts: 200 },\n  { id: 1, ts: 100 },\n  { id: 2, ts: 200 },\n];\nconst ordered = [...events]\n  .sort((a, b) => a.ts - b.ts || a.id - b.id)\n  .map((e) => e.id);","lang":"ts","setup":null,"tables":null,"options":["[2, 3, 1]","[1, 3, 2]","[1, 2, 3]","[3, 2, 1]"],"answer":2,"explain":"a.ts - b.ts is 0 for a tie, and 0 is falsy, so || falls through to the id comparison. A clean way to sort on several keys.","source":null},{"id":"ds-07","tag":"ds","day":3,"q":"Two pointers on a sorted array. Which pair is returned for target 10?","code":"function pairSum(nums: number[], target: number): [number, number] | null {\n  let left = 0;\n  let right = nums.length - 1;\n  while (left \u003c right) {\n    const sum = nums[left] + nums[right];\n    if (sum === target) return [nums[left], nums[right]];\n    if (sum \u003c target) left++;\n    else right--;\n  }\n  return null;\n}\nconst result = pairSum([1, 3, 4, 6, 9], 10);","lang":"ts","setup":null,"tables":null,"options":["[1, 9]","[4, 6]","null","[3, 6]"],"answer":0,"explain":"It starts with the outside pair, 1 + 9 = 10, and returns at once. It runs in O(n) and needs no extra memory, but only works because the input is sorted.","source":null},{"id":"ds-08","tag":"ds","day":4,"q":"A function compares every subscription with every other subscription to find overlaps. What is its time complexity?","code":null,"lang":null,"setup":null,"tables":null,"options":["O(n)","O(n log n)","O(n²)","O(log n)"],"answer":2,"explain":"Two nested loops over n items is about n × n comparisons. Sorting by start date first usually gets overlap checks down to O(n log n).","source":null},{"id":"ds-09","tag":"ds","day":4,"q":"Dedupe while keeping the first-seen order. What is ids?","code":"const ids = [...new Set([3, 1, 3, 2, 1])];","lang":"ts","setup":null,"tables":null,"options":["[3, 1, 3, 2, 1]","[1, 2, 3]","[3, 1, 2]","[2, 1, 3]"],"answer":2,"explain":"A Set keeps insertion order and ignores repeats, so the spread gives the first time each value appeared.","source":null},{"id":"ds-10","tag":"ds","day":4,"q":"Group purchases by user. What is byUser.get(\"u1\")?.length?","code":"type Purchase = { userId: string; productId: string };\nconst purchases: Purchase[] = [\n  { userId: \"u1\", productId: \"pro_monthly\" },\n  { userId: \"u2\", productId: \"lifetime\" },\n  { userId: \"u1\", productId: \"pro_annual\" },\n];\nconst byUser = new Map\u003cstring, Purchase[]>();\nfor (const p of purchases) {\n  const list = byUser.get(p.userId) ?? [];\n  list.push(p);\n  byUser.set(p.userId, list);\n}","lang":"ts","setup":null,"tables":null,"options":["2","3","undefined","1"],"answer":0,"explain":"This is GROUP BY in app code: one pass, a Map from key to list. u1 has two purchases.","source":null},{"id":"ds-11","tag":"ds","day":4,"q":"Merge overlapping access windows. What is merged?","code":"const windows = [[8, 10], [1, 3], [9, 12], [2, 6]];\nconst sortedW = [...windows].sort((a, b) => a[0] - b[0]);\nconst merged: number[][] = [];\nfor (const [start, end] of sortedW) {\n  const last = merged[merged.length - 1];\n  if (last && start \u003c= last[1]) last[1] = Math.max(last[1], end);\n  else merged.push([start, end]);\n}","lang":"ts","setup":null,"tables":null,"options":["[[1, 6], [8, 12]]","[[1, 12]]","[[1, 3], [2, 6], [8, 10], [9, 12]]","[[8, 12], [1, 6]]"],"answer":0,"explain":"Sort by start first, then either extend the last window or start a new one. The sort makes this O(n log n). Useful when two purchases give overlapping entitlement periods.","source":null},{"id":"ds-12","tag":"ds","day":4,"q":"What is m.size?","code":"const m = new Map\u003cnumber | string, string>();\nm.set(1, \"a\");\nm.set(\"1\", \"b\");","lang":"ts","setup":null,"tables":null,"options":["It throws","1","2","0"],"answer":2,"explain":"Map keys keep their type, so 1 and \"1\" are different keys. A plain object turns every key into a string, so obj[1] and obj[\"1\"] would be the same slot.","source":null},{"id":"ds-13","tag":"ds","day":4,"q":"Binary search over a sorted array of 1,000,000 timestamps takes roughly how many comparisons in the worst case?","code":null,"lang":null,"setup":null,"tables":null,"options":["About 1,000","About 1,000,000","About 500,000","About 20"],"answer":3,"explain":"Each step halves the range, and 2^20 is about a million, so it takes about 20 steps. It needs sorted input, which is often the real cost.","source":null},{"id":"ds-14","tag":"ds","day":4,"q":"Users who purchased and also churned. What is both?","code":"const purchased = new Set([\"u1\", \"u2\", \"u3\"]);\nconst churned = [\"u2\", \"u3\", \"u4\"];\nconst both = churned.filter((id) => purchased.has(id));","lang":"ts","setup":null,"tables":null,"options":["[\"u1\"]","[\"u4\"]","[\"u2\", \"u3\"]","[\"u1\", \"u2\", \"u3\", \"u4\"]"],"answer":2,"explain":"An intersection: put one side in a Set, then filter the other side. That is O(n + m) instead of a nested loop.","source":null},{"id":"code-01","tag":"code","day":6,"q":"The app-level version of SUM(price_cents) GROUP BY user_id. What is totals.get(\"u1\")?","code":"const rows = [\n  { userId: \"u1\", priceCents: 999 },\n  { userId: \"u2\", priceCents: 5999 },\n  { userId: \"u1\", priceCents: 5999 },\n];\nconst totals = new Map\u003cstring, number>();\nfor (const r of rows) {\n  totals.set(r.userId, (totals.get(r.userId) ?? 0) + r.priceCents);\n}","lang":"ts","setup":null,"tables":null,"options":["5999","6998","999","12997"],"answer":1,"explain":"Same result as the SQL, done in one pass with a Map. Worth saying out loud in the interview: SQL is usually better when the data is in the database, because only the totals cross the wire.","source":null},{"id":"code-02","tag":"code","day":6,"q":"Revenue for a user with no purchases. What happens?","code":"const amounts: number[] = [];\nconst total = amounts.reduce((sum, a) => sum + a);","lang":"ts","setup":null,"tables":null,"options":["total is undefined","total is NaN","It throws a TypeError","total is 0"],"answer":2,"explain":"reduce with no initial value on an empty array throws \"Reduce of empty array with no initial value\". Pass the start value: reduce((sum, a) => sum + a, 0).","source":null},{"id":"code-03","tag":"code","day":6,"q":"A product is configured with a 0-day trial on purpose. What is trialDays?","code":"const configured: number | undefined = 0;\nconst trialDays = configured || 7;","lang":"ts","setup":null,"tables":null,"options":["NaN","0","7","undefined"],"answer":2,"explain":"|| falls back on any falsy value, and 0 is falsy. Use ?? when only null or undefined should fall back: configured ?? 7 gives 0.","source":null},{"id":"code-04","tag":"code","day":6,"q":"What does this serialize to?","code":"const body = JSON.stringify({ expiresAt: undefined, gracePeriodEndsAt: null });","lang":"ts","setup":null,"tables":null,"options":["{\"gracePeriodEndsAt\":null}","{\"expiresAt\":null,\"gracePeriodEndsAt\":null}","{}","{\"expiresAt\":undefined,\"gracePeriodEndsAt\":null}"],"answer":0,"explain":"JSON has no undefined, so JSON.stringify drops those keys and keeps null. The receiver then sees a missing key, not a null one. Worth knowing when an API treats \"absent\" and \"null\" differently.","source":null},{"id":"code-05","tag":"code","day":6,"q":"Offset pagination over 50 items. How many items are on page 3?","code":"function page\u003cT>(items: T[], pageNumber: number, size: number): T[] {\n  return items.slice((pageNumber - 1) * size, pageNumber * size);\n}\nconst items = Array.from({ length: 50 }, (_, i) => i + 1);\nconst p3 = page(items, 3, 20);","lang":"ts","setup":null,"tables":null,"options":["0","20","30","10"],"answer":3,"explain":"Page 3 starts at index 40 and slice stops at the end, so 10 items (41 to 50). Saying \"is page 1-based or 0-based?\" is a good clarifying question.","source":null},{"id":"code-06","tag":"code","day":6,"q":"Why do many APIs page with a cursor like WHERE (created_at, id) > ($1, $2) ORDER BY created_at, id LIMIT 20, instead of OFFSET?","code":null,"lang":null,"setup":null,"tables":null,"options":["OFFSET isn't supported in Postgres","Cursors return more rows per page","OFFSET can't be combined with ORDER BY","Rows added while someone pages don't shift the pages, and the index jumps straight to the cursor"],"answer":3,"explain":"OFFSET 10000 still reads and throws away 10,000 rows, and inserts move items between pages. A keyset cursor on an indexed (created_at, id) is stable and fast. The id breaks ties.","source":null},{"id":"code-07","tag":"code","day":6,"q":"The same webhook arrives twice (delivery is at least once). What is credits after both calls?","code":"const seen = new Set\u003cstring>();\nlet credits = 0;\nfunction handle(event: { id: string; amount: number }) {\n  if (seen.has(event.id)) return;\n  seen.add(event.id);\n  credits += event.amount;\n}\nhandle({ id: \"evt_1\", amount: 1 });\nhandle({ id: \"evt_1\", amount: 1 });","lang":"ts","setup":null,"tables":null,"options":["0","1","It throws","2"],"answer":1,"explain":"Idempotency: remember the event id and skip repeats. In production the \"seen\" set lives in the database as a unique key, so it survives restarts and works across servers.","source":null},{"id":"code-08","tag":"code","day":6,"q":"Events can arrive out of order. With this guard, what is the final status?","code":"type Ev = { ts: number; status: \"ACTIVE\" | \"EXPIRED\" };\nlet current: Ev | null = null;\nfunction apply(e: Ev) {\n  if (current && e.ts \u003c= current.ts) return; // older or same, ignore\n  current = e;\n}\napply({ ts: 200, status: \"EXPIRED\" });\napply({ ts: 100, status: \"ACTIVE\" }); // arrived late\nconst finalStatus = current?.status;","lang":"ts","setup":null,"tables":null,"options":["undefined","ACTIVE","null","EXPIRED"],"answer":3,"explain":"Compare event time with the stored state's time and drop stale updates. Without the guard, the late ACTIVE would wrongly restore access. Another safe option is to re-fetch current state from the source after any event.","source":null},{"id":"code-09","tag":"code","day":6,"q":"Python, for when the interviewer leans that way. Which id is latest?","code":"rows = [\n    {\"id\": \"a\", \"ts\": 100},\n    {\"id\": \"b\", \"ts\": 300},\n    {\"id\": \"c\", \"ts\": 200},\n]\nlatest = max(rows, key=lambda r: r[\"ts\"])[\"id\"]","lang":"py","setup":null,"tables":null,"options":["b","a","It raises an error","c"],"answer":0,"explain":"max with key= compares on the field you give it, like a comparator. The TypeScript version: rows.reduce((a, b) => (b.ts > a.ts ? b : a)).","source":null},{"id":"code-10","tag":"code","day":6,"q":"Looking up a product that isn't there. What is price?","code":"const products = [{ id: \"pro_monthly\", priceCents: 999 }];\nconst price = products.find((p) => p.id === \"lifetime\")?.priceCents ?? 0;","lang":"ts","setup":null,"tables":null,"options":["undefined","0","It throws","null"],"answer":1,"explain":"find returns undefined when nothing matches, ?. stops before reading the property, and ?? supplies the default. Ask first whether \"missing\" should be 0 or an error.","source":null},{"id":"db-01","tag":"db","day":7,"q":"subscriptions has 20 million rows. Which query gains the most from an index on user_id?","code":null,"lang":null,"setup":null,"tables":null,"options":["SELECT COUNT(*) FROM subscriptions","SELECT SUM(price) FROM subscriptions","SELECT * FROM subscriptions WHERE user_id = 42","SELECT * FROM subscriptions WHERE status \u003c> 'deleted' (almost every row matches)"],"answer":2,"explain":"Indexes pay off when a filter picks out a small slice of a big table. Counting or summing everything, or a filter that matches nearly every row, still reads most of the table.","source":null},{"id":"db-02","tag":"db","day":7,"q":"There is a composite index on events (user_id, event_ts). Which query gets the least help from it?","code":null,"lang":null,"setup":null,"tables":null,"options":["WHERE user_id = 42","WHERE user_id = 42 ORDER BY event_ts DESC LIMIT 1","WHERE user_id = 42 AND event_ts > '2026-01-01'","WHERE event_ts > now() - interval '1 day' (no user_id)"],"answer":3,"explain":"A composite index is sorted by the first column, then the second, like a phone book by last name then first name. Without the leading column, Postgres usually can't seek into it. Put equality columns first, range or sort columns after.","source":null},{"id":"db-03","tag":"db","day":7,"q":"Inside one transaction you insert a purchase row, then the entitlement insert fails on a constraint. What is stored after the rollback?","code":null,"lang":null,"setup":null,"tables":null,"options":["Only the purchase row","Both rows, flagged as failed","Neither row","Only the entitlement row"],"answer":2,"explain":"Atomicity: a transaction commits all of its writes or none. That is why related writes, like a purchase and its entitlement grant, belong in one transaction.","source":null},{"id":"db-04","tag":"db","day":7,"q":"What is the default transaction isolation level in Postgres?","code":null,"lang":null,"setup":null,"tables":null,"options":["Serializable","Read uncommitted","Repeatable read","Read committed"],"answer":3,"explain":"Each statement sees data committed before it started. Two transactions can still read the same value and both write, so counters and balances need atomic updates or row locks.","source":null},{"id":"db-05","tag":"db","day":7,"q":"A page loads 100 users, then runs one query per user to fetch their subscriptions. What is this called, and what is the usual fix?","code":null,"lang":null,"setup":null,"tables":null,"options":["N+1 queries. Fetch them in one query with a JOIN or WHERE user_id = ANY($1)","A cartesian product. Add DISTINCT","A deadlock. Add a retry","A full table scan. Add an index on users.id"],"answer":0,"explain":"1 query plus N follow-ups is 101 round trips. Batch them into one query and group in app code, or join in SQL.","source":null},{"id":"db-06","tag":"db","day":7,"q":"Two servers get the same webhook at the same moment. Each checks \"is this event id processed?\" and then inserts. What makes this safe?","code":null,"lang":null,"setup":null,"tables":null,"options":["Checking twice before inserting","A UNIQUE constraint on event_id, with INSERT ... ON CONFLICT DO NOTHING deciding who processes it","A longer timeout on the webhook handler","Sorting the events by id first"],"answer":1,"explain":"Check-then-insert has a race window where both checks pass. A unique constraint makes the database settle it: exactly one insert wins, and the loser sees zero rows inserted and skips.","source":null},{"id":"db-07","tag":"db","day":7,"q":"What is the difference between EXPLAIN and EXPLAIN ANALYZE?","code":null,"lang":null,"setup":null,"tables":null,"options":["EXPLAIN ANALYZE rewrites the query to be faster","EXPLAIN shows the planned steps and estimates. EXPLAIN ANALYZE also runs the query and shows real timings and row counts","EXPLAIN ANALYZE only works on SELECT","They are the same"],"answer":1,"explain":"Because ANALYZE really executes it, wrap an UPDATE or DELETE in BEGIN ... ROLLBACK if you analyze one. Look for Seq Scan on big tables and estimates far from actual rows.","source":null},{"id":"db-08","tag":"db","day":7,"q":"Products have a list price, and subscriptions point to products. Where should the price the customer actually paid live?","code":null,"lang":null,"setup":null,"tables":null,"options":["On the subscription or transaction row, because it is a historical fact that must not change when the list price does","In a JSON blob on the user","Recomputed from the current list price at report time","Only on the product row, joined when needed, to stay normalized"],"answer":0,"explain":"Normalization removes accidental duplication, but the price paid at purchase time is its own fact. Joining to today's list price would rewrite history after a price change.","source":null},{"id":"db-09","tag":"db","day":7,"q":"App code does: read n from counters, add 1, write n back. Two requests run at once. What can happen, and what's the simple fix?","code":null,"lang":null,"setup":null,"tables":null,"options":["A duplicate row. Add DISTINCT","A lost update, where both read 5 and both write 6. Use UPDATE counters SET n = n + 1 WHERE id = $1","Nothing, because Postgres serializes everything by default","A deadlock every time. Add an index"],"answer":1,"explain":"Read committed doesn't stop two readers from seeing the same old value. A single UPDATE with n = n + 1 is atomic. SELECT ... FOR UPDATE also works when logic sits between the read and the write.","source":null},{"id":"db-10","tag":"db","day":7,"q":"Why not add an index on every column?","code":null,"lang":null,"setup":null,"tables":null,"options":["Indexes make SELECT slower","Each index costs storage and slows every INSERT and UPDATE that has to maintain it","Indexes stop working above a million rows","Postgres allows only one index per table"],"answer":1,"explain":"Index the columns your real queries filter, join or sort on, and check with EXPLAIN. Write-heavy tables like an events log feel the cost most.","source":null},{"id":"dbg-01","tag":"debug","day":9,"q":"You are handed a repo with one failing test and 20 minutes. What first?","code":null,"lang":null,"setup":null,"tables":null,"options":["Rewrite the function the clean way","Delete the test if the code looks right","Run it and read the failing assertion: expected vs actual, and which input","Add logging to every function in the module"],"answer":2,"explain":"The test is the spec you were given. Expected vs actual usually points at the bug, and reading it aloud shows the interviewer how you work.","source":null},{"id":"dbg-02","tag":"debug","day":9,"q":"A report total is off for one customer out of thousands. Good next step?","code":null,"lang":null,"setup":null,"tables":null,"options":["Round the numbers so they match","Make a minimal repro: that one customer's rows, run through the function alone","Re-run the whole report a few times to see if it changes","Swap in a different SQL engine"],"answer":1,"explain":"Shrink the input until the bug still happens with the fewest rows. A small repro also becomes the regression test once it's fixed.","source":null},{"id":"dbg-03","tag":"debug","day":9,"q":"What is total?","code":"const amounts = [5, 10, 15];\nlet total = 0;\nfor (let i = 0; i \u003c= amounts.length; i++) {\n  total += amounts[i];\n}","lang":"ts","setup":null,"tables":null,"options":["30","NaN","45","It throws a RangeError"],"answer":1,"explain":"i \u003c= length reads one past the end, amounts[3] is undefined, and 30 + undefined is NaN. JS doesn't throw on out-of-range reads. Use i \u003c amounts.length or for...of.","source":null},{"id":"dbg-04","tag":"debug","day":9,"q":"A helper sorts events for display. Later code expects the original arrival order. What is events[0].id after this runs?","code":"const events = [{ id: \"b\", ts: 2 }, { id: \"a\", ts: 1 }];\nfunction newestFirst(list: { id: string; ts: number }[]) {\n  return list.sort((x, y) => y.ts - x.ts);\n}\nconst display = newestFirst(events);\ndisplay.reverse();","lang":"ts","setup":null,"tables":null,"options":["undefined","\"a\"","\"b\"","It throws"],"answer":1,"explain":"sort and reverse change the array in place and return the same array, so display and events are one object. Copy first ([...list].sort(...)) or use toSorted() and toReversed() in Node 20+.","source":null},{"id":"dbg-05","tag":"debug","day":9,"q":"On a laptop set to America/New_York, what does this return?","code":"const month = new Date(\"2026-03-01\").getMonth();","lang":"ts","setup":null,"tables":null,"options":["3","2 (March)","0","1 (February)"],"answer":3,"explain":"A date-only string is parsed as UTC midnight, which is Feb 28 evening in New York, and getMonth() is local time and 0-based. Use getUTCMonth(), or keep dates as UTC timestamps and convert only for display.","source":null},{"id":"dbg-06","tag":"debug","day":9,"q":"What does this print?","code":"const ok = 0.1 + 0.2 === 0.3;","lang":"ts","setup":null,"tables":null,"options":["It throws","undefined","false","true"],"answer":2,"explain":"Binary floats can't hold 0.1 exactly, so the sum is 0.30000000000000004. Store money as integer cents, or numeric in Postgres, and format at the edge.","source":null},{"id":"dbg-07","tag":"debug","day":9,"q":"Python shared-state bug. What is second?","code":"def add_event(event, log=[]):\n    log.append(event)\n    return log\n\nfirst = add_event(\"INITIAL_PURCHASE\")\nsecond = add_event(\"RENEWAL\")","lang":"py","setup":null,"tables":null,"options":["[\"RENEWAL\"]","It raises an error","[\"INITIAL_PURCHASE\", \"RENEWAL\"]","[]"],"answer":2,"explain":"A default argument is created once, when the function is defined, so every call shares the same list. Use log=None and create a new list inside. It is the Python cousin of mutating a shared array in JS.","source":null},{"id":"rc-01","tag":"domain","day":1,"q":"A user buys the pro_annual product. What should the app check to unlock premium features?","code":null,"lang":null,"setup":null,"tables":null,"options":["Whether the \"pro\" entitlement is active in CustomerInfo","Whether the current Offering contains pro_annual","Whether the user has seen the paywall","Whether the product id equals \"pro_annual\""],"answer":0,"explain":"Entitlements are the level of access. Checking them means you don't hardcode product ids, so new products or price tests unlock the same features once they're attached to the entitlement.","source":"https://www.revenuecat.com/docs/getting-started/entitlements"},{"id":"rc-02","tag":"domain","day":1,"q":"In RevenueCat, what is a Package?","code":null,"lang":null,"setup":null,"tables":null,"options":["A bundle of entitlements sold together","A set of webhook events for one user","A group of equivalent products across iOS, Android and web, inside an Offering","A store receipt file"],"answer":2,"explain":"Offering → Packages → products. A \"monthly\" package can hold the App Store, Play and web monthly products, so one paywall works on every platform.","source":"https://www.revenuecat.com/docs/offerings/overview"},{"id":"rc-03","tag":"domain","day":1,"q":"How do products and entitlements relate?","code":null,"lang":null,"setup":null,"tables":null,"options":["Many to many: one product can unlock several entitlements, and several products can unlock the same entitlement","Entitlements are a type of product","One to one: every product has exactly one entitlement","Products belong to exactly one Offering and inherit its entitlement"],"answer":0,"explain":"A monthly and an annual product both unlock \"pro\". A bundle product might unlock \"pro\" and \"maps\". Model it as a join table if you sketch the schema.","source":"https://www.revenuecat.com/docs/getting-started/entitlements"},{"id":"rc-04","tag":"domain","day":2,"q":"Why build the paywall against the \"current\" Offering instead of a hardcoded offering id?","code":null,"lang":null,"setup":null,"tables":null,"options":["The current offering is always cheaper","You can change which products show from the dashboard (default offering, Targeting, Experiments) without an app update","Hardcoded ids are rejected by the App Store","Only the current offering can contain packages"],"answer":1,"explain":"The current Offering is the project's default unless Targeting or an Experiment picks another, so the paywall can change remotely.","source":"https://www.revenuecat.com/docs/offerings/overview"},{"id":"rc-05","tag":"domain","day":3,"q":"A free trial converts to the first paid period. Which webhook event signals it?","code":null,"lang":null,"setup":null,"tables":null,"options":["TRIAL_CONVERTED","RENEWAL, with is_trial_conversion: true","INITIAL_PURCHASE, a second time","PRODUCT_CHANGE"],"answer":1,"explain":"The trial starts with INITIAL_PURCHASE and period_type TRIAL (price 0). Conversion counts as a renewal, and is_trial_conversion only appears on RENEWAL.","source":"https://www.revenuecat.com/docs/integrations/webhooks/event-types-and-fields"},{"id":"rc-06","tag":"domain","day":3,"q":"On the App Store, who gets an Introductory Offer, and how is it applied?","code":null,"lang":null,"setup":null,"tables":null,"options":["Anyone with a redemption code","Lapsed users only, when the app presents it manually","Existing subscribers at renewal","New users. Apple applies it automatically to eligible purchases"],"answer":3,"explain":"Intro offers (a free trial or discounted first periods) are for new customers. Promotional offers target existing or lapsed subscribers and must be presented by the app. You can check eligibility to show the right price.","source":"https://www.revenuecat.com/docs/subscription-guidance/subscription-offers/ios-subscription-offers"},{"id":"rc-07","tag":"domain","day":4,"q":"Your webhook handler receives BILLING_ISSUE. What should happen to the user's access?","code":null,"lang":null,"setup":null,"tables":null,"options":["Delete the subscription row","Issue a refund","Revoke access immediately","Nothing yet. A billing issue isn't an expiration, and with a grace period the user keeps access. Revoke on EXPIRATION"],"answer":3,"explain":"The store retries billing, and the user may fix their card. Remove access when EXPIRATION arrives (reason BILLING_ERROR if the grace period ends unpaid). A recovery sends RENEWAL.","source":"https://www.revenuecat.com/docs/integrations/webhooks/event-types-and-fields"},{"id":"rc-08","tag":"domain","day":7,"q":"A subscriber turns off auto-renew today, with 20 days left in the period. In RevenueCat's churn chart, when do they count as churned?","code":null,"lang":null,"setup":null,"tables":null,"options":["Never, because they paid for the period","When they open the app next","When the subscription expires, at the end of the period","Today, when they cancel"],"answer":2,"explain":"Cancelled isn't churned. Churn counts paid subscriptions that lost access in the period. In the meantime they may un-cancel (UNCANCELLATION).","source":"https://www.revenuecat.com/docs/dashboard-and-metrics/charts/churn-chart"},{"id":"rc-09","tag":"domain","day":7,"q":"An active $120/year subscription contributes how much to MRR?","code":null,"lang":null,"setup":null,"tables":null,"options":["$120 in the purchase month, then $0","$0, because only monthly plans count","$10 per month","$120 per month"],"answer":2,"explain":"MRR normalizes every duration to one month: yearly is price × 1/12. One-time and consumable purchases aren't in MRR.","source":"https://www.revenuecat.com/docs/dashboard-and-metrics/charts/monthly-recurring-revenue-mrr-chart"},{"id":"rc-10","tag":"domain","day":8,"q":"How does RevenueCat compute Realized LTV per Customer for a cohort?","code":null,"lang":null,"setup":null,"tables":null,"options":["Revenue divided by paying customers only","MRR multiplied by 12","Average price of the most popular product","Revenue from the cohort minus refunds, divided by all new customers in the cohort (paying or not)"],"answer":3,"explain":"\"Customer\" means anyone who opened the app, so this per-customer LTV is closer to ARPU. There is a separate chart for LTV per paying customer.","source":"https://www.revenuecat.com/docs/dashboard-and-metrics/charts/realized-ltv-per-customer-chart"},{"id":"rc-11","tag":"domain","day":6,"q":"Apple sends App Store Server Notifications. What is Google Play's equivalent that RevenueCat asks you to set up?","code":null,"lang":null,"setup":null,"tables":null,"options":["Firebase Cloud Messaging","Google Play Billing Webhooks v2","Real-Time Developer Notifications","Play Receipt Push"],"answer":2,"explain":"Both are store-to-server notifications configured in each store's console, pointed at RevenueCat. For one-time purchases they're usually how RevenueCat learns about refunds.","source":"https://www.revenuecat.com/docs/platform-resources/server-notifications"},{"id":"rc-12","tag":"domain","day":6,"q":"RevenueCat webhooks are best-effort at-least-once. Your server failed once and the event was retried. How do you avoid processing it twice?","code":null,"lang":null,"setup":null,"tables":null,"options":["Use event_timestamp_ms alone as a unique key across all users","Compare the HMAC signature, which is identical on retries","Return a 500 on the retry","Store the event id. Retries reuse the same id, so skip any id you've already processed"],"answer":3,"explain":"The docs say retries reuse the payload id and event_timestamp_ms, while the signature is recomputed on each attempt. Respond 200 fast and defer the work. The docs also suggest calling GET /subscribers after any webhook to sync full state.","source":"https://www.revenuecat.com/docs/integrations/webhooks"},{"id":"rc-13","tag":"domain","day":9,"q":"A customer gets a refund from Apple support. Which webhook do you get, and what's the trap?","code":null,"lang":null,"setup":null,"tables":null,"options":["No webhook. Refunds only show in Charts","EXPIRATION with reason REFUND","CANCELLATION with cancel_reason CUSTOMER_SUPPORT. Auto-renew may still be on, so check current status","REFUND, which always ends the subscription"],"answer":2,"explain":"Refunds arrive as CANCELLATION (price can be negative). A refund doesn't necessarily turn off auto-renew, so don't assume the subscription is over. Re-fetch status.","source":"https://www.revenuecat.com/docs/integrations/webhooks/event-types-and-fields"},{"id":"live-01","tag":"live","day":8,"q":"The interviewer finishes describing the problem. Best first move?","code":null,"lang":null,"setup":null,"tables":null,"options":["Open with the most optimal algorithm you know","Start typing right away to show speed","Ask to see the expected answer","Restate it in your words, ask about edge cases and input shape, name a simple approach, then start coding"],"answer":3,"explain":"RevenueCat lists listening and making sure you understand the task first in what they look for. Restating catches misunderstandings while they are cheap.","source":null},{"id":"live-02","tag":"live","day":8,"q":"You're halfway through and stuck on a bug. Most useful thing to do?","code":null,"lang":null,"setup":null,"tables":null,"options":["Say what you expected and what you see, then test a small input out loud. Ask the interviewer if useful","Go quiet until it works","Say you usually let AI do this part","Start over in a different language"],"answer":0,"explain":"They grade on explaining your thinking even when it is early, and they describe the session as collaborative. Thinking out loud lets them help you.","source":null},{"id":"live-03","tag":"live","day":4,"q":"You see a simple O(n²) solution and a clever O(n) one you're unsure of. With 25 minutes left?","code":null,"lang":null,"setup":null,"tables":null,"options":["Say both, build the simple one, check it works, then improve it if time allows","Spend 15 minutes deciding","Build the clever one and hope","Build both at once"],"answer":0,"explain":"\"Building a simple solution\" is one of their criteria. A working version you can talk about beats a half-built clever one. Naming the faster idea still shows you saw it.","source":null},{"id":"live-04","tag":"live","day":8,"q":"Your code runs. What before saying \"done\"?","code":null,"lang":null,"setup":null,"tables":null,"options":["Say done, they'll test it","Ask for the next question","Refactor names for 10 minutes","Walk through one example by hand, try an edge case (empty, NULL, duplicate), and sum up trade-offs"],"answer":3,"explain":"\"Checking the solution\" is on their list. One traced example and one edge case takes two minutes and is the part interviewers remember.","source":null},{"id":"live-05","tag":"live","day":8,"q":"You forget the exact syntax for a Postgres window function mid-interview. What now?","code":null,"lang":null,"setup":null,"tables":null,"options":["Guess and keep going silently","Ask the interviewer to write it for you","Say so and look it up. They allow web lookups for syntax","Rewrite it as nested loops to avoid the syntax"],"answer":2,"explain":"Their guide says you will have web access for syntax you aren't expected to have memorized. Using your tools comfortably is a criterion, and AI tools aren't allowed.","source":null}],"tables":{"users":"users\nid | name | country\n---+------+--------\n1  | ana  | US\n2  | ben  | DE\n3  | cy   | US\n4  | dee  | NULL","subscriptions":"subscriptions\nid | user_id | product_id  | status  | started_at | price\n---+---------+-------------+---------+------------+-------\n1  | 1       | pro_monthly | active  | 2026-01-05 | 9.99\n2  | 1       | pro_annual  | active  | 2026-03-10 | 59.99\n3  | 2       | pro_monthly | expired | 2026-01-20 | 9.99\n4  | 3       | pro_monthly | active  | 2026-02-02 | 9.99\n5  | 3       | lifetime    | active  | 2026-02-15 | 149.99\n6  | 2       | pro_monthly | active  | 2026-03-01 | 9.99","events":"events\nid | user_id | type             | event_ts\n---+---------+------------------+-----------------\n1  | 1       | INITIAL_PURCHASE | 2026-01-05 10:00\n2  | 1       | RENEWAL          | 2026-02-05 10:00\n3  | 1       | CANCELLATION     | 2026-02-20 09:00\n4  | 2       | INITIAL_PURCHASE | 2026-01-20 12:00\n5  | 2       | EXPIRATION       | 2026-02-20 12:00\n6  | 3       | INITIAL_PURCHASE | 2026-02-02 08:00\n7  | 3       | RENEWAL          | 2026-03-02 08:00\n8  | 2       | INITIAL_PURCHASE | 2026-03-01 15:00"},"bosses":[{"id":"boss-1","day":8,"title":"Top 2 products per month","tag":"sql","prompt":"Finance wants a monthly report: for each month, the top 2 products by revenue, leaving out refunded transactions. Show month (YYYY-MM), product name and revenue in cents. Talk through what to do with ties before you write it.","data":"CREATE TABLE products (id text PRIMARY KEY, name text);\nCREATE TABLE transactions (id int PRIMARY KEY, user_id text, product_id text, purchased_at timestamp, price_cents int, refunded boolean);\nINSERT INTO products VALUES ('m','Pro Monthly'),('a','Pro Annual'),('l','Lifetime');\nINSERT INTO transactions VALUES\n (1,'u1','m','2026-01-03 10:00',999,false),\n (2,'u2','a','2026-01-09 12:00',5999,false),\n (3,'u3','l','2026-01-20 08:00',14999,true),\n (4,'u4','m','2026-01-31 23:30',999,false),\n (5,'u1','m','2026-02-03 10:00',999,false),\n (6,'u5','l','2026-02-11 09:00',14999,false),\n (7,'u6','a','2026-02-14 16:00',5999,false),\n (8,'u7','a','2026-02-28 21:00',5999,true);","expected":"2026-01, Pro Annual, 5999 / 2026-01, Pro Monthly, 1998 / 2026-02, Lifetime, 14999 / 2026-02, Pro Annual, 5999","solution":"WITH monthly AS (\n  SELECT date_trunc('month', t.purchased_at) AS month,\n         p.name AS product,\n         SUM(t.price_cents) AS revenue_cents\n  FROM transactions t\n  JOIN products p ON p.id = t.product_id\n  WHERE NOT t.refunded\n  GROUP BY 1, 2\n),\nranked AS (\n  SELECT month, product, revenue_cents,\n         RANK() OVER (PARTITION BY month ORDER BY revenue_cents DESC) AS rnk\n  FROM monthly\n)\nSELECT to_char(month, 'YYYY-MM') AS month, product, revenue_cents\nFROM ranked\nWHERE rnk \u003c= 2\nORDER BY month, revenue_cents DESC, product;","notes":"Ask about ties (RANK keeps both, ROW_NUMBER picks one) and about time zones: the Jan 31 23:30 row lands in January in UTC but could be February elsewhere. Aggregate first, then rank."},{"id":"boss-2","day":10,"title":"Latest webhook event per user (SQL)","tag":"sql","prompt":"Webhooks arrive at least once and can arrive out of order. From webhook_events, return the latest event per app_user_id by event time. Duplicate deliveries share an event_id. Say how you order ties.","data":"CREATE TABLE webhook_events (event_id text, app_user_id text, type text, event_timestamp_ms bigint, received_at timestamp);\nINSERT INTO webhook_events VALUES\n ('e1','u1','INITIAL_PURCHASE',1000,'2026-03-01 10:00:00'),\n ('e2','u1','RENEWAL',2000,'2026-03-01 10:05:00'),\n ('e2','u1','RENEWAL',2000,'2026-03-01 10:07:30'),\n ('e3','u2','INITIAL_PURCHASE',1500,'2026-03-01 10:01:00'),\n ('e5','u2','EXPIRATION',3000,'2026-03-01 10:02:00'),\n ('e4','u2','BILLING_ISSUE',2500,'2026-03-01 10:09:00'),\n ('e6','u3','INITIAL_PURCHASE',1200,'2026-03-01 10:03:00');","expected":"u1, RENEWAL, 2000 / u2, EXPIRATION, 3000 / u3, INITIAL_PURCHASE, 1200","solution":"WITH deduped AS (\n  -- the same event can arrive more than once; keep one copy per event_id\n  SELECT DISTINCT ON (event_id) event_id, app_user_id, type, event_timestamp_ms\n  FROM webhook_events\n  ORDER BY event_id, received_at\n),\nranked AS (\n  SELECT *,\n         ROW_NUMBER() OVER (\n           PARTITION BY app_user_id\n           ORDER BY event_timestamp_ms DESC, event_id DESC  -- event time, not arrival time\n         ) AS rn\n  FROM deduped\n)\nSELECT app_user_id, type, event_timestamp_ms\nFROM ranked\nWHERE rn = 1\nORDER BY app_user_id;","notes":"u2's BILLING_ISSUE arrived last but happened before the EXPIRATION, so order by event_timestamp_ms, not received_at. Dedup by event_id first. Here it doesn't change the answer, but it matters as soon as you count or sum."},{"id":"boss-3","day":8,"title":"Same thing in TypeScript on arrays","tag":"code","prompt":"Now do boss 2 in application code. Input is an array of events, output is one event per user sorted by user id. Then say which version you would ship and why.","data":"const input: WebhookEvent[] = [\n  { eventId: \"e1\", appUserId: \"u1\", type: \"INITIAL_PURCHASE\", eventTimestampMs: 1000 },\n  { eventId: \"e2\", appUserId: \"u1\", type: \"RENEWAL\", eventTimestampMs: 2000 },\n  { eventId: \"e2\", appUserId: \"u1\", type: \"RENEWAL\", eventTimestampMs: 2000 },\n  { eventId: \"e3\", appUserId: \"u2\", type: \"INITIAL_PURCHASE\", eventTimestampMs: 1500 },\n  { eventId: \"e5\", appUserId: \"u2\", type: \"EXPIRATION\", eventTimestampMs: 3000 },\n  { eventId: \"e4\", appUserId: \"u2\", type: \"BILLING_ISSUE\", eventTimestampMs: 2500 },\n  { eventId: \"e6\", appUserId: \"u3\", type: \"INITIAL_PURCHASE\", eventTimestampMs: 1200 },\n];\nconst out = latestEventPerUser(input).map((e) => [e.appUserId, e.type, e.eventTimestampMs]);\n// expected: [[\"u1\",\"RENEWAL\",2000],[\"u2\",\"EXPIRATION\",3000],[\"u3\",\"INITIAL_PURCHASE\",1200]]","expected":"[[\"u1\",\"RENEWAL\",2000],[\"u2\",\"EXPIRATION\",3000],[\"u3\",\"INITIAL_PURCHASE\",1200]]","solution":"type WebhookEvent = {\n  eventId: string;\n  appUserId: string;\n  type: string;\n  eventTimestampMs: number;\n};\n\nfunction latestEventPerUser(events: WebhookEvent[]): WebhookEvent[] {\n  const latest = new Map\u003cstring, WebhookEvent>();\n  for (const e of events) {\n    const current = latest.get(e.appUserId);\n    const isNewer =\n      !current ||\n      e.eventTimestampMs > current.eventTimestampMs ||\n      (e.eventTimestampMs === current.eventTimestampMs && e.eventId > current.eventId);\n    if (isNewer) latest.set(e.appUserId, e);\n  }\n  // duplicates of the same event_id can't change the answer: same timestamp, same id\n  return [...latest.values()].sort((a, b) => a.appUserId.localeCompare(b.appUserId));\n}","notes":"One pass with a Map is O(n). In the trade-off talk: SQL when the data already lives in Postgres and is large, app code when the events are already in memory or need logic SQL makes awkward."},{"id":"boss-4","day":9,"title":"Fix the failing test","tag":"debug","prompt":"This function has a failing test. Read the test first, say what you expect versus what you get, find the bug or bugs, fix them, and name one more test you would add.","data":"type Tx = { userId: string; amountCents: number; refunded: boolean };\n\nfunction revenueByUser(txs: Tx[]): Record\u003cstring, number> {\n  const totals: Record\u003cstring, number> = {};\n  for (let i = 0; i \u003c txs.length - 1; i++) {\n    const tx = txs[i];\n    if (tx.refunded) continue;\n    totals[tx.userId] = totals[tx.userId] + tx.amountCents;\n  }\n  return totals;\n}\n\n// failing test\nconst txs: Tx[] = [\n  { userId: \"u1\", amountCents: 999, refunded: false },\n  { userId: \"u2\", amountCents: 14999, refunded: true },\n  { userId: \"u2\", amountCents: 5999, refunded: false },\n  { userId: \"u1\", amountCents: 999, refunded: false },\n];\nconst got = revenueByUser(txs);\n// expected { u1: 1998, u2: 5999 }","expected":"{\"u1\":1998,\"u2\":5999}","solution":"type Tx = { userId: string; amountCents: number; refunded: boolean };\n\nfunction revenueByUser(txs: Tx[]): Record\u003cstring, number> {\n  const totals: Record\u003cstring, number> = {};\n  for (const tx of txs) {                                      // bug 1: loop skipped the last row\n    if (tx.refunded) continue;\n    totals[tx.userId] = (totals[tx.userId] ?? 0) + tx.amountCents; // bug 2: undefined + n is NaN\n  }\n  return totals;\n}\n// Then add tests for: empty input -> {}, all refunded -> {}, one user only.","notes":"The buggy version returns { u1: NaN, u2: NaN }. There are two bugs, an off-by-one and a missing default, and the NaN hides the second one until you fix the first."},{"id":"boss-5","day":8,"title":"Tiny entitlement check","tag":"domain","prompt":"Given a user's purchase events and a product-to-entitlements map, write hasEntitlement(events, entitlement, nowMs). Cancelling (auto-renew off) keeps access until expiry. A refund ends access. Events may arrive out of order.","data":"const now = 5000;\nconst results = [\n  // monthly bought, cancelled (auto-renew off) but not yet expired -> still pro\n  hasEntitlement([\n    { type: \"INITIAL_PURCHASE\", productId: \"pro_monthly\", eventTimestampMs: 1000, expiresAtMs: 9000 },\n    { type: \"CANCELLATION\", productId: \"pro_monthly\", eventTimestampMs: 2000, expiresAtMs: 9000, cancelReason: \"UNSUBSCRIBE\" },\n  ], \"pro\", now),\n  // refunded -> not pro\n  hasEntitlement([\n    { type: \"INITIAL_PURCHASE\", productId: \"pro_monthly\", eventTimestampMs: 1000, expiresAtMs: 9000 },\n    { type: \"CANCELLATION\", productId: \"pro_monthly\", eventTimestampMs: 2000, expiresAtMs: 9000, cancelReason: \"CUSTOMER_SUPPORT\" },\n  ], \"pro\", now),\n  // expired, events delivered out of order -> not pro\n  hasEntitlement([\n    { type: \"EXPIRATION\", productId: \"pro_monthly\", eventTimestampMs: 4000, expiresAtMs: 4000 },\n    { type: \"INITIAL_PURCHASE\", productId: \"pro_monthly\", eventTimestampMs: 1000, expiresAtMs: 4000 },\n  ], \"pro\", now),\n  // lifetime unlocks maps forever\n  hasEntitlement([\n    { type: \"INITIAL_PURCHASE\", productId: \"lifetime\", eventTimestampMs: 1000, expiresAtMs: null },\n  ], \"maps\", now),\n  // monthly doesn't unlock maps\n  hasEntitlement([\n    { type: \"INITIAL_PURCHASE\", productId: \"pro_monthly\", eventTimestampMs: 1000, expiresAtMs: 9000 },\n  ], \"maps\", now),\n];\n// expected [true, false, false, true, false]","expected":"[true,false,false,true,false]","solution":"type PurchaseEvent = {\n  type: \"INITIAL_PURCHASE\" | \"RENEWAL\" | \"CANCELLATION\" | \"EXPIRATION\";\n  productId: string;\n  eventTimestampMs: number;\n  expiresAtMs: number | null;      // null = lifetime / non-expiring\n  cancelReason?: \"UNSUBSCRIBE\" | \"CUSTOMER_SUPPORT\";\n};\n\n// product -> entitlements it unlocks (many to many)\nconst productEntitlements: Record\u003cstring, string[]> = {\n  pro_monthly: [\"pro\"],\n  pro_annual: [\"pro\"],\n  lifetime: [\"pro\", \"maps\"],\n};\n\nfunction hasEntitlement(events: PurchaseEvent[], entitlement: string, nowMs: number): boolean {\n  // access end per product; Infinity = never expires\n  const accessUntil = new Map\u003cstring, number>();\n  const ordered = [...events].sort((a, b) => a.eventTimestampMs - b.eventTimestampMs);\n  for (const e of ordered) {\n    switch (e.type) {\n      case \"INITIAL_PURCHASE\":\n      case \"RENEWAL\":\n        accessUntil.set(e.productId, e.expiresAtMs ?? Infinity);\n        break;\n      case \"CANCELLATION\":\n        // auto-renew off: keep access until expiry. Refund: access ends now.\n        if (e.cancelReason === \"CUSTOMER_SUPPORT\") accessUntil.set(e.productId, e.eventTimestampMs);\n        break;\n      case \"EXPIRATION\":\n        accessUntil.set(e.productId, e.eventTimestampMs);\n        break;\n    }\n  }\n  for (const [productId, until] of accessUntil) {\n    if ((productEntitlements[productId] ?? []).includes(entitlement) && until > nowMs) return true;\n  }\n  return false;\n}","notes":"This is a simplified model for practice. RevenueCat's docs recommend calling GET /subscribers after a webhook rather than rebuilding state from events, which is a good trade-off to mention."},{"id":"boss-6","day":10,"title":"Why is this revenue too high?","tag":"debug","prompt":"A teammate says this query should return revenue per user, only for users with at least one RENEWAL. The numbers look too high. Using the shared users, subscriptions and events tables, find out why and fix it.","data":"-- \"Revenue per user, only for users who have at least one RENEWAL event\"\nSELECT u.name, SUM(s.price) AS revenue\nFROM users u\nJOIN subscriptions s ON s.user_id = u.id\nJOIN events e ON e.user_id = u.id\nWHERE e.type = 'RENEWAL' OR e.type = 'INITIAL_PURCHASE'\nGROUP BY u.name\nORDER BY u.name;","expected":"ana, 69.98 / cy, 159.98","solution":"-- Two problems:\n-- 1. The filter says RENEWAL OR INITIAL_PURCHASE, so ben (no renewal) gets in.\n-- 2. Joining events fans out: each subscription row repeats once per matching event,\n--    so SUM counts the same price several times.\n-- Fix: keep events out of the join and test existence instead.\nSELECT u.name, SUM(s.price) AS revenue\nFROM users u\nJOIN subscriptions s ON s.user_id = u.id\nWHERE EXISTS (\n  SELECT 1 FROM events e\n  WHERE e.user_id = u.id AND e.type = 'RENEWAL'\n)\nGROUP BY u.name\nORDER BY u.name;","notes":"Buggy output is \"ana, 139.96 / ben, 39.96 / cy, 319.96\". Spotting a join fan-out is a core skill: compare COUNT(*) before and after adding a join."}],"tags":{"sql":"SQL","ds":"Data structures & complexity","code":"App-level coding (TS / Python)","db":"Database concepts","debug":"Debugging & testing","domain":"RevenueCat & subscriptions","live":"Live-coding habits"},"days":{"1":"Day 1 · Sat Oct 31 · Light start: SQL basics","2":"Day 2 · Sun Nov 1 · SQL fluency: joins, group by, window functions","3":"Day 3 · Mon Nov 2 · Data structures and complexity (TypeScript), part 1","4":"Day 4 · Tue Nov 3 · Data structures and complexity (TypeScript), part 2","5":"Day 5 · Wed Nov 4 · Rest day: short light quiz","6":"Day 6 · Thu Nov 5 · SQL, then the same logic in app code","7":"Day 7 · Fri Nov 6 · Database concepts plus short quiz","8":"Day 8 · Sat Nov 7 · Mock 1: live-coding habits, boss fights, mixed review","9":"Day 9 · Sun Nov 8 · Debugging and your weakest tags","10":"Day 10 · Mon Nov 9 · Mock 2: boss fights, mixed review","11":"Day 11 · Tue Nov 10 · 20-minute quiz and interview-day habits"},"dates":{"1":"2026-10-31","2":"2026-11-01","3":"2026-11-02","4":"2026-11-03","5":"2026-11-04","6":"2026-11-05","7":"2026-11-06","8":"2026-11-07","9":"2026-11-08","10":"2026-11-09","11":"2026-11-10"},"packs":{"1":["sql-01","sql-02","sql-03","sql-04","sql-05","sql-07","sql-08","sql-09","sql-10","rc-01","rc-02","rc-03"],"2":["sql-06","sql-11","sql-12","sql-13","sql-14","sql-15","sql-16","sql-17","sql-21","sql-22","rc-04","sql-03","sql-08"],"3":["ds-01","ds-02","ds-03","ds-04","ds-05","ds-06","ds-07","rc-05","rc-06","sql-11","sql-16"],"4":["ds-08","ds-09","ds-10","ds-11","ds-12","ds-13","ds-14","rc-07","live-03","ds-02","ds-06"],"5":["sql-01","sql-08","sql-13","ds-03","ds-09","ds-13","rc-02","rc-03","rc-05","rc-07"],"6":       if(raw.indexOf('\n')===-1) lines.push('- **'+L[i]+'.** '+raw+mark);
      else lines.push('- **'+L[i]+'.**'+mark,'', mdFence(raw, q.lang));
    });
    lines.push('');
    lines.push('**Correct answer:** '+L[q.answer]+'. '+String(q.options[q.answer]).replace(/\s+/g,' ').trim());
    lines.push('');
    lines.push('**Explanation:** '+q.explain);
    if(q.source){ lines.push(''); lines.push('**Source:** '+q.source); }
    lines.push('');
  });
  return lines.join('\n');
}
function revealPreview(md){

function fallbackCopy(text){
  const area=document.createElement('textarea');
  area.value=text; area.setAttribute('readonly','');
  area.style.position='fixed'; area.style.left='0'; area.style.top='0'; area.style.opacity='0';
  document.body.appendChild(area); area.focus(); area.select();

  area.remove(); return ok;
}

}
function downloadReviewMarkdown(){

   <div class="card" style="margin:10px 0"><div class="row"><label class="chk" style="margin:0"><input type="checkbox" id="useTimer" checked> Show 45-minute timer</label></div>
     <div id="timerBox"><div class="timer" id="clock" aria-live="off">${fmtTime(timeLeft)}</div>
     <div class="row"><button class="btn small" id="tStart">Start</button><button class="btn small" id="tPause">Pause</button><button class="btn small" id="tReset">Reset</button></div></div></div>
   <details id="sol"><summary>Reveal the model solution (after your attempt)</summary>${codeBlock(b.solution)}<p class="meta">${esc(b.notes)}</p></details>
   <h2 style="margin-top:14px">Self-check</h2>
   ${CHECKS.map((c,i)=>`<label class="chk"><input type="checkbox" class="sc" data-i="${i}"> ${esc(c)}</label>`).join('')}
   <div class="row" style="margin-top:8px"><button class="btn primary small" id="score">Score this fight</button><button class="btn small" data-go="boss">← Boss list</button></div>
   <div id="bfb"></div></div>`;
  bindGo();
  $('useTimer').onchange=e=>{ $('timerBox').classList.toggle('hidden',!e.target.checked); if(!e.target.checked) stopTimer(); };
  $('tStart').onclick=()=>{ if(timer) return; timer=setInterval(()=>{ timeLeft=Math.max(0,timeLeft-1); const c=$('clock'); if(!c){ stopTimer(); return; } c.textContent=fmtTime(timeLeft); if(timeLeft===0){ stopTimer(); toast('Time. Wrap up: test one example and sum up trade-offs.'); } },1000); };
  $('tPause').onclick=stopTimer;
  $('tReset').onclick=()=>{ stopTimer(); timeLeft=45*60; $('clock').textContent=fmtTime(timeLeft); };
  $('score').onclick=()=>scoreBoss(b);
}
function scoreBoss(b){
  const n=[...document.querySelectorAll('.sc')].filter(x=>x.checked).length;
  const key=b.id+'|'+today(); const prev=S.boss[b.id];
  S.boss[b.id]={best:Math.max(prev?prev.best:0,n), last:today()};
  let msg;
  if(S.bossDay[key]){ msg=`Logged ${n}/7. XP for this boss is already counted today, so come back tomorrow for more.`; }
  else {
    S.bossDay[key]=n;
    if(n===7) S.fullTicks++;
    msg = n ? `${n}/7 ticked · +${n*5} XP.` : 'Logged. Every round counts, even a rough one.';
    if(n===7) msg+=' All seven. That is exactly what they grade. 😼';
    else if(n) msg+=' Next time, aim for: '+CHECKS.filter((c,i)=>!document.querySelector(`.sc[data-i="${i}"]`).checked)[0].toLowerCase()+'.';
    addXp(n*5);
  }
  checkBadges(); save(); hud(); stopTimer();
  $('bfb').innerHTML=`<div class="fb good">${esc(msg)}</div>`;
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ home(); return; }
  if(e.target && (e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA')) return;
  if(!session || !session.q || !$('qtext')) return;
  const k=e.key.toLowerCase(); const m={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3};
  if(k in m && !session.done && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); answer(m[k]); }
  else if((e.key==='0' || e.key==='?') && !session.done && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); dunno(); }
  else if(e.key==='Enter' && session.done && $('next')){ e.preventDefault(); next(); }
});
window.catQuestTest={KEY,state:()=>S,currentSession:()=>session,reviewPile,exportReviewMarkdown,reviewReasonLabel,normalize,fresh,today,dayDiff};
load(); bindSaveBar(); hud(); home();
// a newer copy may sit in IndexedDB (for example after localStorage was cleared); adopt it if nothing has started yet
idbGet().then(b=>{ if(b && (b.savedAt||0)>(S.savedAt||0) && !session){ S=normalize(b); save(); hud(); home(); toast('Progress restored from this browser\'s backup copy.'); } });
</script>
